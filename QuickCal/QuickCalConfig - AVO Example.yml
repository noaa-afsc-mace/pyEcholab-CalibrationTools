##### Configuration file for QuickCalGui_AVO in AVO mode #####

# Top-level mode flag: when set to "avo", the GUI runs the integrated
# AVO coverage-check workflow instead of the full QuickCal calibration path.
calibration_mode: "avo"

### Output definitions ###

# AVO figures and summary CSV will be written under:
#   <output_directory>/avo_output/
# This replaces figure_folder from AVO.ini.
# Output directory for calibration results.
output_directory: "D:/MACE-repos/pyEcholab-CalibrationTools/QuickCal/CalCompare/avo"

# The only default environmental setting we are using.
environment_settings:
  transducer_depth: 9.15

# Default sphere size in millimeters; channel-specific values override this.
default_sphere_size: 38.1
# Default sphere material; channel-specific values override this.
default_sphere_material: "Tungsten carbide"
# Allowed +/- range around each channel's sphere_range, in meters.
sphere_range_tolerance: 3
# Allowed +/- target strength window around the calculated reference TS.
sphere_ts_tolerance: 5

# Global single target detection parameters; channel-specific overrides win.
detection_parameters:
  # Pulse length determination level (dB below the pulse peak).
  PLDL: 6.0
  # Maximum normalized pulse length allowed for accepted targets.
  maxNormPulseLen: 1.5
  # Minimum normalized pulse length allowed for accepted targets.
  minNormPulseLen: 0.1
  # Maximum beam compensation value allowed for accepted targets.
  maxBeamComp: 0.1
  # Maximum alongship angle standard deviation for accepted targets.
  maxSDalong: 0.6
  # Maximum athwartship angle standard deviation for accepted targets.
  maxSDathwart: 0.6
  # Minimum target strength (dB) retained during target detection.
  min_threshold: -50.0
  # Maximum target strength (dB) retained during target detection.
  max_threshold: 0

### Hidden AVO settings migrated from AVO.ini ###

avo_settings:
  temp: 5.5
  salinity: 32.5
  lat: 55.0
  sphere_diameter: 38.1
  sphere_material: "Tungsten carbide"
  beam_width_deg: 6.5
  vessel: "AKN"
  subsector_divisions: 6
  min_targets_per_division: 1

